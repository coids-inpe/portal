services:
  web:
    build:
      context: ..
      dockerfile: ./docker/django_dev_pesq/Dockerfile
    env_file:
      - ../test.env
    environment:
      django_settings_module: 'portal.settings.test'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver --insecure 0.0.0.0:8000"
    volumes:
      - ..:/app
    ports:
      - "8001:8000"
  redis:
    image: redis
    container_name: test_redis
    command: redis-server
    networks:
      - storm
    ports:
      - "6379:6379"
  django-celery:
    build:
      context: ..
      dockerfile: ./docker/django_dev_pesq/Dockerfile
    container_name: test_django-celery
    network_mode: host
    environment:
      django_settings_module: 'portal.settings.test'
    command: 
      - /bin/bash
      - -c
      - |
        python manage.py makemigrations
        celery -A portal worker -l info -E
    volumes:
      - ..:/app
    depends_on:
      - redis
networks:
  storm:
    external: true
